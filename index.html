<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIK Lunch</title>
<meta name="theme-color" content="#060A13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIK Lunch">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a matchday programme — crest bar on top, week "fixture" card, then the choice list. Dark club look with AIK yellow used sparingly. */
:root{
  --bg:#060A13;
  --bg-2:#0A1020;
  --surface:#0F1728;
  --surface-2:#152038;
  --line:rgba(214,226,255,.09);
  --line-2:rgba(214,226,255,.16);
  --text:#EEF2F8;
  --muted:#8E99B0;
  --faint:#5D6880;
  --gold:#F7C600;
  --gold-soft:rgba(247,198,0,.12);
  --gold-ink:#1B1400;
  --ok:#35D48A;
  --ok-soft:rgba(53,212,138,.13);
  --bad:#FF6A5C;
  --bad-soft:rgba(255,106,92,.12);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  --r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 500px at 85% -10%, rgba(247,198,0,.07), transparent 60%),
                   radial-gradient(900px 600px at -10% 10%, rgba(40,70,140,.18), transparent 60%);
  background-attachment:fixed;
  color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 140px}
.wrap.wide{max-width:1080px}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:14px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 70%, transparent);}
.top img{width:34px;height:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.top .sp{flex:1}
.wk{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line-2);padding:5px 10px;border-radius:999px;color:var(--gold);white-space:nowrap}

/* fixture card */
.fixture{position:relative;overflow:hidden;border-radius:20px;padding:20px 20px 18px;margin-top:6px;
  background:linear-gradient(135deg,#121D35 0%,#0C1426 60%,#0A1120 100%);border:1px solid var(--line);}
.fixture::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;
  border:28px solid rgba(247,198,0,.06)}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.fixture h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1;margin:6px 0 14px;
  text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.days{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.day{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.day small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.day strong{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em}
.deadline{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--muted);position:relative;z-index:1;flex-wrap:wrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(53,212,138,.6);animation:p 2s infinite}
.pulse.closed{background:var(--bad);animation:none}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(53,212,138,0)}100%{box-shadow:0 0 0 0 rgba(53,212,138,0)}}
.deadline b{color:var(--text);font-weight:600}
.meter{height:4px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:14px;overflow:hidden;position:relative;z-index:1}
.meter i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .6s ease}
.meter-l{font-size:12.5px;color:var(--muted);margin-top:6px;position:relative;z-index:1;font-variant-numeric:tabular-nums}

/* section titles */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 2px 10px}
.sec h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin:0;color:var(--muted)}
.sec .hint{font-size:13px;color:var(--faint)}

/* search */
.search{position:relative;margin-top:18px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 14px 42px;font-size:16px;outline:none}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}

/* name grid */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.nm{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 10px;min-height:54px;transition:transform .12s ease,border-color .15s,background .15s;min-width:0}
.nm:hover{border-color:var(--line-2);background:var(--surface-2)}
.nm:active{transform:scale(.98)}
.num{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:800;
  font-size:17px;background:var(--bg-2);color:var(--gold);border:1px solid var(--line);letter-spacing:.02em}
.num.staff{font-size:12px;color:var(--muted)}
.nm .t{min-width:0;flex:1;font-weight:600;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.nm .t small{display:block;font-weight:500;font-size:11.5px;color:var(--faint);margin-top:2px}
.nm.done .t small{color:var(--ok)}
.check{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#03140B}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r)}

/* resume banner */
.resume{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--gold-soft);
  border:1px solid rgba(247,198,0,.3);width:100%;text-align:left}
.resume .t{flex:1;min-width:0}
.resume small{display:block;color:var(--muted);font-size:12.5px}
.resume b{font-weight:600}
.resume .go{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-size:14px;white-space:nowrap}

/* order form */
.who{display:flex;align-items:center;gap:12px;margin-top:8px}
.who .num{width:44px;height:44px;font-size:22px;border-radius:12px}
.who h1{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;margin:0;line-height:1;letter-spacing:.01em}
.who p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.linkbtn{background:none;border:0;color:var(--gold);padding:6px 0;font-weight:600;font-size:14px}
.dayhead{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.dayhead .tag{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--gold);color:var(--gold-ink);padding:4px 9px;border-radius:6px}
.dayhead h2{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;margin:0;letter-spacing:.03em}
.dayhead .st{margin-left:auto;font-size:12.5px;color:var(--faint)}
.dayhead .st.ok{color:var(--ok)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line-2)}
.opt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);margin-top:1px;display:grid;place-items:center;transition:all .15s}
.opt.on{border-color:var(--gold);background:linear-gradient(0deg,var(--gold-soft),var(--gold-soft)),var(--surface)}
.opt.on .rd{border-color:var(--gold);background:var(--gold)}
.opt.on .rd::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold-ink)}
.opt .t{flex:1;min-width:0;font-weight:500;font-size:15px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;
  background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
.chip.V{color:#7FE0A7;border-color:rgba(127,224,167,.25)}
.chip.NY{color:var(--gold);border-color:rgba(247,198,0,.3)}
.diets{display:inline-flex;gap:4px;margin-left:8px;vertical-align:1px}
.diet{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-family:var(--display);font-weight:800;font-size:12px;line-height:1;letter-spacing:0;flex:none}
.diet.G{background:#F2B33D;color:#2A1A00}
.diet.L{background:#6FB7FF;color:#04213F}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-2px 0 10px}
.legend .diet:not(:first-child){margin-left:8px}
.opt.skip .t{color:var(--muted)}
.opt.skip.on{border-color:var(--line-2);background:var(--surface-2)}
.opt.skip.on .rd{background:var(--muted);border-color:var(--muted)}
.extras{margin-top:10px;padding:12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:14px;font-weight:600;color:var(--muted)}
.tg.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;outline:none}
.field:focus{border-color:var(--gold)}
.warn{font-size:12.5px;color:#FFB86B}
.closed-note{margin-top:14px;padding:14px;border-radius:var(--r);background:var(--bad-soft);border:1px solid rgba(255,106,92,.3);font-size:14.5px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent, var(--bg) 30%);}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center;background:rgba(15,23,40,.92);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:18px;padding:10px 10px 10px 16px}
.bar .sum{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.35}
.bar .sum b{color:var(--text);font-weight:600}
.btn{border:0;border-radius:12px;padding:13px 18px;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--gold);color:var(--gold-ink);white-space:nowrap;transition:transform .1s,opacity .15s;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:10px}
.btn.dark{background:var(--surface-2);color:var(--text);border:1px solid var(--line-2)}

/* done */
.done-card{margin-top:30px;text-align:center;padding:30px 20px;border-radius:20px;background:linear-gradient(160deg,#122036,#0B1222);border:1px solid var(--line)}
.done-card .big{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:var(--gold-ink);
  animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.done-card h1{font-family:var(--display);font-weight:800;font-size:32px;text-transform:uppercase;margin:0 0 4px}
.done-card p{color:var(--muted);margin:0 0 18px}
.recap{text-align:left;display:flex;flex-direction:column;gap:8px;margin:0 0 20px}
.recap div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.recap small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:2px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;transition:all .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--bad);color:#200300}

.foot{margin-top:40px;text-align:center;font-size:12px;color:var(--faint)}
.foot a{color:var(--faint)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);gap:12px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--gold);animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}

/* ---------- admin ---------- */
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login img{width:64px;margin-bottom:14px}
.login h1{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 20px}
.login form{display:flex;flex-direction:column;gap:10px}
.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.weekbar .nav{display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center}
.weekbar h1{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;margin:0;letter-spacing:.01em}
.weekbar .dates{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pill.open{background:var(--ok-soft);color:var(--ok)}
.pill.locked{background:var(--gold-soft);color:var(--gold)}
.pill.sent{background:rgba(255,255,255,.07);color:var(--text)}
.tabs{display:flex;gap:4px;margin:18px 0 6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 12px 12px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi b.bad{color:var(--bad)}
.kpi b.gold{color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.panel h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.panel h3 .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--gold)}
.drow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
.drow .c{font-family:var(--display);font-weight:800;font-size:22px;text-align:right;font-variant-numeric:tabular-nums}
.drow .c.zero{color:var(--faint)}
.drow .nmx{font-size:14px;line-height:1.25;min-width:0}
.drow .nmx small{display:block;color:var(--gold);font-size:12px;font-weight:600}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.stepper button{width:30px;height:30px;background:transparent;border:0;font-size:17px;color:var(--muted)}
.stepper button:hover{background:var(--surface-2);color:var(--text)}
.stepper span{min-width:22px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.stepper span.has{color:var(--gold)}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:14px 0 6px}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pname{font-size:13px;padding:5px 9px;border-radius:8px;background:var(--bad-soft);color:#FFB1A8;border:1px solid rgba(255,106,92,.2)}
.pname.muted{background:rgba(255,255,255,.05);color:var(--muted);border-color:var(--line)}
.notes{display:flex;flex-direction:column;gap:6px}
.notes div{font-size:13.5px;padding:7px 9px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line)}
.notes b{font-weight:600}
.notes em{font-style:normal;color:var(--gold)}
.tablewrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;background:var(--bg-2);position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:rgba(255,255,255,.025)}
td .miss{color:var(--bad);font-weight:600}
td .skip{color:var(--faint)}
td .by{font-size:11px;color:var(--faint);display:block}
.grp td{background:var(--bg-2);font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--faint);padding:7px 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.toolbar .sp{flex:1}
textarea.field{min-height:220px;resize:vertical;line-height:1.5;font-size:14.5px}
.preview{display:flex;flex-direction:column;gap:6px}
.preview>div{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 10px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line)}
.preview i{font-style:normal;font-family:var(--display);font-weight:800;color:var(--gold);width:18px;text-align:right}
.mail{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55;background:var(--bg-2);border:1px solid var(--line);
  border-radius:12px;padding:14px;max-height:460px;overflow:auto;color:#D6DDEA}
.callout{padding:12px 14px;border-radius:12px;font-size:14px;margin-top:14px}
.callout.warn{background:var(--gold-soft);border:1px solid rgba(247,198,0,.3);color:var(--text)}
.callout.ok{background:var(--ok-soft);border:1px solid rgba(53,212,138,.3)}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .field{padding:8px 10px;font-size:14px}
.tagset{display:flex;gap:4px}
.tagset button{font-size:11px;font-weight:700;padding:5px 7px;border-radius:6px;border:1px solid var(--line-2);background:transparent;color:var(--faint);letter-spacing:.06em}
.tagset button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--faint);transition:all .15s}
.sw.on{background:var(--ok)}
.sw.on::after{left:18px;background:#fff}
.prow{display:grid;grid-template-columns:70px 1fr 100px auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.prow .field{padding:8px 10px;font-size:14px}
.prow select.field{padding:8px 6px}

/* modal sheet */
.scrim{position:fixed;inset:0;background:rgba(3,6,12,.7);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line-2);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;gap:10px}
.sheet .hd h2{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;margin:0;flex:1;min-width:0}
.sheet .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:0;padding-top:10px;background:linear-gradient(transparent,var(--bg) 30%)}

.remind{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--bad-soft);border:1px solid rgba(255,106,92,.25)}
.remind .t{flex:1;min-width:220px;font-size:14px}
.remind .t b{display:block;font-weight:600}
.remind .t span{color:var(--muted);font-size:13px}
.btn.wa{background:#25D366;color:#062B15;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;font-size:15px}
.opt.locked{cursor:default}
.callout.lockmsg{display:flex;gap:8px;align-items:flex-start;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:var(--muted);margin:0}
.callout.lockmsg b{color:var(--text)}
.callout.lockmsg svg{flex:none;margin-top:3px}
.dayhead .st svg{vertical-align:-2px}
.bar .in.confirm{border-color:rgba(247,198,0,.45)}
@media (min-width:760px){
  .scrim{align-items:center}
  .sheet{border-radius:22px;border-bottom:1px solid var(--line-2)}
}
@media (max-width:760px){
  .two{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:56px 1fr auto auto}
  .prow .kind{display:none}
  .mrow{grid-template-columns:1fr auto}
  .mrow .field{grid-column:1/-1}
}
@media (max-width:380px){
  .names{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"><div class="loading"><div class="spin"></div><div>Loading…</div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- config ---------- */
const SB_URL = "https://cimqebnwkotpbvqmshhh.supabase.co";
const SB_KEY = "sb_publishable_sgNS0eE-w93tj2StcjAUrg_-mygpcYc";
const TEAM = "AIK Fotboll Damer";
const CONTACT = "Micke";

/* ---------- utils ---------- */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  sget(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } },
  sset(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} },
  sdel(k){ try { sessionStorage.removeItem(k); } catch(e){} },
};
const SERVER_MSG = {
  "Ogiltig dag.": "Invalid day.",
  "Veckan måste börja på en måndag.": "The week must start on a Monday.",
  "Menyn kunde inte läsas.": "The menu couldn't be read.",
  "Namn och typ krävs.": "Name and type are required.",
  "Namn krävs.": "Name is required.",
  "Lösenordet måste vara minst 8 tecken.": "The password must be at least 8 characters.",
};
async function rpc(fn, args = {}) {
  let r;
  try {
    r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: { apikey: SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(args),
    });
  } catch (e) { throw new Error("No connection. Check your internet and try again."); }
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (SERVER_MSG[j.message] || j.message)) || "Something went wrong. Try again.");
  if (j && j.error) throw new Error(SERVER_MSG[j.error] || j.error);
  return j;
}
let toastT;
function toast(msg, err = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastT); toastT = setTimeout(() => t.className = "toast" + (err ? " err" : ""), err ? 4200 : 2400);
}
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MON_SV = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
function pd(s){ const [y,m,d] = s.slice(0,10).split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); }
function fmtDay(s){ const d = pd(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; }
function fmtDaySv(s){ const d = pd(s); return `${d.getUTCDate()} ${MON_SV[d.getUTCMonth()]}`; }
function fmtShort(s){ const d = pd(s); return `${d.getUTCDate()}/${d.getUTCMonth()+1}`; }
function isoWeek(s){
  const d = pd(s); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3);
  const fy = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  return 1 + Math.round(((d - fy) / 864e5 - 3 + ((fy.getUTCDay() + 6) % 7)) / 7);
}
function addDays(s, n){ const d = pd(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function fmtStamp(ts){
  return new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Stockholm",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(ts));
}
function countdown(ms){
  if (ms <= 0) return "closed";
  const m = Math.floor(ms/6e4), d = Math.floor(m/1440), h = Math.floor((m%1440)/60), mm = m%60;
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${mm}m`;
  return `${mm} min`;
}
const TAGS = { G:"Gluten-free", L:"Lactose-free", V:"Vegetarian", NY:"New" };
const DIET = ["G","L"];
const chips = tags => {
  tags = tags || [];
  const diet = DIET.filter(t => tags.includes(t)).map(t => `<span class="diet ${t}" title="${TAGS[t]}" aria-label="${TAGS[t]}">${t}</span>`).join("");
  const rest = tags.filter(t => !DIET.includes(t));
  return (diet ? `<span class="diets">${diet}</span>` : "") + (rest.length ? `<div class="chips">${rest.map(t => `<span class="chip ${esc(t)}">${esc(TAGS[t] || t)}</span>`).join("")}</div>` : "");
};
const legend = `<div class="legend"><span class="diet G">G</span> Gluten-free <span class="diet L">L</span> Lactose-free</div>`;
const ICON = {
  check:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bigcheck:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  lock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  left:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  refresh:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>',
  wa:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 001.8-1.2 2.2 2.2 0 00.1-1.2c0-.2-.2-.2-.5-.4z"/></svg>',
};
const topbar = (sub, right = "") => `
  <header class="top">
    <img src="logo.png" alt="AIK">
    <div class="brand"><b>AIK Damer</b><span>${esc(sub)}</span></div>
    <div class="sp"></div>${right}
  </header>`;

/* ---------- shared order form ---------- */
function blankDay(){ return { dish:null, skip:false, note:"" }; }
function fromServer(o){ return o ? { dish:o.dish ?? null, skip:!!o.skip, note:o.note || "" } : blankDay(); }
function dayChosen(d){ return !!(d && (d.dish || d.skip)); }
function toPayload(d){ return dayChosen(d) ? { dish:d.skip ? null : d.dish, skip:d.skip, gluten:false, lactose:false, note:d.note } : null; }
function choiceText(d, list){ return d.skip ? "Not eating" : (list.find(x => x.id === d.dish)?.name || "—"); }

function daySection(key, label, dateStr, dishes, d, scope, locked = false){
  const chosen = dayChosen(d);
  const short = label.slice(0,3);
  const head = `<div class="dayhead"><span class="tag">${short}</span><h2>${esc(label)} ${fmtDay(dateStr)}</h2>
      <span class="st ${chosen ? "ok" : ""}">${locked ? `${ICON.lock} Sent` : chosen ? "Chosen ✓" : "Not chosen"}</span></div>`;
  if (locked) {
    const sel = dishes.find(x => x.id === d.dish);
    return head + `<div class="opt on locked"><span class="rd"></span><span class="t">${d.skip ? "Not eating this day" : esc(sel ? sel.name : "—")}${sel ? chips(sel.tags) : ""}
      ${d.note ? `<span class="by" style="color:var(--gold)">${esc(d.note)}</span>` : ""}</span></div>`;
  }
  let body;
  if (!dishes.length) {
    body = `<div class="empty">${key === "tue" ? "The Tuesday menu isn't up yet. Pick Thursday now and come back later." : "No menu yet."}</div>`;
  } else {
    body = `<div class="opts" role="radiogroup" aria-label="${esc(label)}">` +
      dishes.map(x => `<button type="button" class="opt ${d.dish === x.id && !d.skip ? "on" : ""}" role="radio" aria-checked="${d.dish === x.id && !d.skip}"
          data-act="pick" data-scope="${scope}" data-day="${key}" data-id="${x.id}">
          <span class="rd"></span><span class="t">${esc(x.name)}${chips(x.tags)}</span></button>`).join("") +
      `<button type="button" class="opt skip ${d.skip ? "on" : ""}" role="radio" aria-checked="${d.skip}" data-act="skip" data-scope="${scope}" data-day="${key}">
          <span class="rd"></span><span class="t">Not eating this day</span></button></div>`;
    if (d.dish && !d.skip) {
      body += `<div class="extras">
        <input class="field" id="note-${scope}-${key}" maxlength="120" placeholder="Without… (e.g. no sauce, no onion)" value="${esc(d.note)}" data-act="note" data-scope="${scope}" data-day="${key}" autocomplete="off">
      </div>`;
    }
  }
  return head + (dishes.some(x => (x.tags || []).some(t => DIET.includes(t))) ? legend : "") + body;
}

/* ---------- PLAYER ---------- */
const P = { state:null, view:"names", person:null, draft:null, locked:{tue:false,thu:false}, q:"", saving:false, confirm:false, skew:0, loadingOrder:false };

async function playerLoad(){
  P.state = await rpc("get_state");
  P.skew = new Date(P.state.now).getTime() - Date.now();
}
function nowServer(){ return Date.now() + P.skew; }
function personById(id){ return P.state.people.find(p => p.id === id); }
const first = n => n.split(" ")[0];

function renderPlayer(){
  const s = P.state; if (!s) return;
  const wk = isoWeek(s.week);
  const ms = new Date(s.deadline).getTime() - nowServer();
  const open = ms > 0;
  const total = s.people.length, done = s.people.filter(p => p.done).length;
  let html = `<div class="wrap">` + topbar("Lunch orders", `<span class="wk">Wk ${wk}</span>`);

  if (P.view === "names") {
    const last = Number(store.get("aik_person"));
    const lp = last && personById(last);
    const q = P.q.trim().toLowerCase();
    const list = s.people.filter(p => !q || p.name.toLowerCase().includes(q) || String(p.tag || "").toLowerCase() === q);
    const players = list.filter(p => p.kind === "player"), staff = list.filter(p => p.kind === "staff");
    const card = p => `<button type="button" class="nm ${p.done ? "done" : ""}" data-act="person" data-id="${p.id}">
        <span class="num ${p.kind === "staff" ? "staff" : ""}">${esc(p.tag || "")}</span>
        <span class="t">${esc(p.name)}<small>${p.done ? "Ordered" : "Not ordered"}</small></span>
        ${p.done ? `<span class="check">${ICON.check}</span>` : ""}</button>`;
    html += `
      <section class="fixture">
        <div class="eyebrow">Week ${wk}</div>
        <h1>Pick your lunch</h1>
        <div class="days">
          <div class="day"><small>Tuesday</small><strong>${fmtDay(s.tue_date)}</strong></div>
          <div class="day"><small>Thursday</small><strong>${fmtDay(s.thu_date)}</strong></div>
        </div>
        <div class="deadline"><span class="pulse ${open ? "" : "closed"}"></span>
          ${open ? `Closes in <b data-cd>${countdown(ms)}</b> · Sun ${fmtDay(addDays(s.week,-1))} at 13:00` : `<b>Ordering has closed.</b>`}</div>
        <div class="meter"><i style="width:${total ? Math.round(done/total*100) : 0}%"></i></div>
        <div class="meter-l">${done} of ${total} have ordered</div>
      </section>
      ${lp ? `<button type="button" class="resume" data-act="person" data-id="${lp.id}">
          <span class="num ${lp.kind === "staff" ? "staff" : ""}">${esc(lp.tag || "")}</span>
          <span class="t"><small>Continue as</small><b>${esc(lp.name)}</b></span><span class="go">${lp.done ? "View" : "Order"} →</span></button>` : ""}
      <div class="search">${ICON.search}<input id="q" type="search" placeholder="Search your name or number" value="${esc(P.q)}" autocomplete="off" aria-label="Search name"></div>
      ${players.length ? `<div class="sec"><h2>Players</h2><span class="hint">Tap your name</span></div><div class="names">${players.map(card).join("")}</div>` : ""}
      ${staff.length ? `<div class="sec"><h2>Staff</h2></div><div class="names">${staff.map(card).join("")}</div>` : ""}
      ${!players.length && !staff.length ? `<div class="empty" style="margin-top:16px">No name matches “${esc(P.q)}”. Message ${CONTACT} if you're missing.</div>` : ""}
      <div class="foot">Once you've sent your order, only ${CONTACT} can change it.<br>${esc(TEAM)} · <a href="#admin">Admin</a></div></div>`;
    $app.innerHTML = html;
    return;
  }

  const p = P.person, dr = P.draft;
  const who = `<div class="who"><span class="num ${p.kind === "staff" ? "staff" : ""}">${esc(p.tag || "")}</span>
      <div style="flex:1;min-width:0"><h1>${esc(first(p.name))}</h1><p>${esc(p.name)} · week ${wk}</p></div>
      <button type="button" class="linkbtn" data-act="back">Not you?</button></div>`;

  if (P.loadingOrder) {
    $app.innerHTML = html + who + `<div class="loading" style="min-height:30vh"><div class="spin"></div></div></div>`;
    return;
  }

  if (P.view === "order") {
    const allLocked = P.locked.tue && P.locked.thu;
    if (allLocked) {
      html += who + `<div class="done-card">
          <div class="big">${ICON.bigcheck}</div>
          <h1>Order sent</h1>
          <p>Your lunch for week ${wk} is booked.</p>
          <div class="recap">
            <div><small>Tuesday ${fmtDay(s.tue_date)}</small>${esc(choiceText(dr.tue, s.tue))}${dr.tue.note ? ` · <span style="color:var(--gold)">${esc(dr.tue.note)}</span>` : ""}</div>
            <div><small>Thursday ${fmtDay(s.thu_date)}</small>${esc(choiceText(dr.thu, s.thu))}${dr.thu.note ? ` · <span style="color:var(--gold)">${esc(dr.thu.note)}</span>` : ""}</div>
          </div>
          <div class="callout lockmsg">${ICON.lock}<span>Need to change something? Message <b>${CONTACT}</b> and he'll update it for you.</span></div>
          <div style="margin-top:16px"><button type="button" class="btn" data-act="back">Done</button></div>
        </div></div>`;
      $app.innerHTML = html;
      return;
    }
    html += who +
      (open ? "" : `<div class="closed-note">Ordering for week ${wk} has closed. Message ${CONTACT} if something needs changing.</div>`) +
      daySection("tue","Tuesday", s.tue_date, s.tue, dr.tue, "p", P.locked.tue) +
      daySection("thu","Thursday", s.thu_date, s.thu, dr.thu, "p", P.locked.thu) +
      `<div class="foot">After you send, your choices are locked. Message ${CONTACT} to change them.</div></div>`;
    const any = (!P.locked.tue && dayChosen(dr.tue)) || (!P.locked.thu && dayChosen(dr.thu));
    if (P.confirm) {
      html += `<div class="bar"><div class="in confirm">
        <div class="sum"><b>Send your order?</b><br>You can't change it yourself afterwards.</div>
        <button type="button" class="btn ghost sm" data-act="unconfirm">Back</button>
        <button type="button" class="btn" data-act="submit" ${P.saving ? "disabled" : ""}>${P.saving ? "Sending…" : "Send"}</button>
      </div></div>`;
    } else {
      html += `<div class="bar"><div class="in">
        <div class="sum"><b>Tue:</b> ${esc(choiceText(dr.tue, s.tue))}<br><b>Thu:</b> ${esc(choiceText(dr.thu, s.thu))}</div>
        <button type="button" class="btn" data-act="review" ${(!any || !open) ? "disabled" : ""}>Send</button>
      </div></div>`;
    }
    $app.innerHTML = html;
    return;
  }

  if (P.view === "done") {
    const missing = !dayChosen(dr.tue) ? "Tuesday" : !dayChosen(dr.thu) ? "Thursday" : "";
    html += `<div class="done-card">
        <div class="big">${ICON.bigcheck}</div>
        <h1>Thanks, ${esc(first(p.name))}!</h1>
        <p>Your order for week ${wk} is saved.</p>
        <div class="recap">
          <div><small>Tuesday ${fmtDay(s.tue_date)}</small>${esc(dayChosen(dr.tue) ? choiceText(dr.tue, s.tue) : "Nothing chosen yet")}${dr.tue.note ? ` · <span style="color:var(--gold)">${esc(dr.tue.note)}</span>` : ""}</div>
          <div><small>Thursday ${fmtDay(s.thu_date)}</small>${esc(dayChosen(dr.thu) ? choiceText(dr.thu, s.thu) : "Nothing chosen yet")}${dr.thu.note ? ` · <span style="color:var(--gold)">${esc(dr.thu.note)}</span>` : ""}</div>
        </div>
        ${missing ? `<div class="callout warn" style="margin:0 0 16px;text-align:left">You haven't picked anything for ${missing}. Come back and choose before Sunday at 13:00.</div>` : ""}
        <div class="callout lockmsg">${ICON.lock}<span>Need to change something? Message <b>${CONTACT}</b>.</span></div>
        <div style="margin-top:16px"><button type="button" class="btn" data-act="back">Done</button></div>
      </div></div>`;
    $app.innerHTML = html;
  }
}

async function openPerson(id){
  const p = personById(id); if (!p) return;
  P.person = p; store.set("aik_person", String(id));
  P.draft = { tue: blankDay(), thu: blankDay() }; P.locked = { tue:false, thu:false };
  P.view = "order"; P.confirm = false; P.loadingOrder = true; renderPlayer(); window.scrollTo({ top: 0 });
  try {
    const o = await rpc("get_order", { p_person: id, p_week: P.state.week });
    if (P.person && P.person.id === id) {
      ["tue","thu"].forEach(k => {
        const srv = o && o[k];
        if (srv && (srv.dish || srv.skip)) { P.draft[k] = fromServer(srv); P.locked[k] = true; }
      });
    }
  } catch (e) { toast(e.message, true); }
  P.loadingOrder = false; renderPlayer();
}

async function submitPlayer(){
  if (P.saving) return;
  P.saving = true; renderPlayer();
  try {
    await rpc("submit_order", { p_person: P.person.id, p_week: P.state.week,
      p_tue: P.locked.tue ? null : toPayload(P.draft.tue), p_thu: P.locked.thu ? null : toPayload(P.draft.thu) });
    const me = personById(P.person.id); if (me) me.done = dayChosen(P.draft.tue) && dayChosen(P.draft.thu);
    P.view = "done"; P.confirm = false; window.scrollTo({ top: 0 });
  } catch (e) { toast(e.message, true); P.confirm = false; }
  P.saving = false; renderPlayer();
}

async function adminLoad(week){
  const d = await rpc("admin_week", { p_pw: A.pw, p_week: week || null });
  A.data = d; A.week = d.week;
  if (!A.mailTo) A.mailTo = d.caterer_email || "";
}
function aOrders(){ const m = {}; (A.data.orders || []).forEach(o => { (m[o.person] = m[o.person] || {})[o.day] = o; }); return m; }
function dishName(day, id){ const x = A.data[day].find(d => d.id === id); return x ? x.name : "(removed dish)"; }
function computeDay(day){
  const om = aOrders(); const people = A.data.people;
  const counts = new Map(A.data[day].filter(d => d.active).map(d => [d.id, 0]));
  const notes = [], missing = [], skipped = [];
  people.forEach(p => {
    const o = (om[p.id] || {})[day];
    if (!o) { if (p.active) missing.push(p); return; }
    if (o.skip) { skipped.push(p); return; }
    counts.set(o.dish, (counts.get(o.dish) || 0) + 1);
    if (o.note) notes.push({ p, dish:o.dish, note:o.note });
  });
  const extras = new Map((A.data.extras || []).filter(e => e.day === day).map(e => [e.dish, e.qty]));
  const ordered = [...counts.values()].reduce((a,b) => a+b, 0);
  const extraSum = [...extras.values()].reduce((a,b) => a+b, 0);
  return { counts, notes, missing, skipped, extras, ordered, extraSum, total: ordered + extraSum };
}
function missingBoth(){ const om = aOrders(); return A.data.people.filter(p => p.active).filter(p => { const o = om[p.id] || {}; return !o.tue || !o.thu; }); }
function reminderText(){
  const wk = isoWeek(A.data.week);
  const names = missingBoth().map(p => { const [f, l] = p.name.split(" "); return f + (l ? " " + l.charAt(0) + "." : ""); });

}

}

function parseMenu(text){
  let t = text.replace(/\u00a0/g, " ");
  const m = t.match(/tisdag\s*:?([\s\S]*?)(?:\n\s*(?:onsdag|torsdag|fredag|måndag)\s*:|$)/i);
  if (m && /tisdag\s*:/i.test(t)) t = m[1];
  return t.split(/\r?\n/)
    .map(l => l.replace(/^\s*(?:[-–•*·]|\d+[.)])\s*/, "").replace(/\s+/g, " ").trim())
    .filter(l => l && !/^(måndag|tisdag|onsdag|torsdag|fredag)\s*:?$/i.test(l))
    .map(l => { const tags = []; const v = l.match(/^vegetarisk\s*:\s*/i); if (v) { tags.push("V"); l = l.slice(v[0].length); }
      let mk; l = l.replace(/[\s:;,/]+$/, "");
      while ((mk = l.match(/\s*[-–(]\s*([GL])\s*\)?$/))) { if (!tags.includes(mk[1])) tags.unshift(mk[1]); l = l.slice(0, mk.index).replace(/[\s:;,/]+$/, ""); }
      return { name: l.charAt(0).toUpperCase() + l.slice(1), tags }; })
    .slice(0, 30);
}

/* The email goes to a Swedish caterer, so it stays in Swedish. */
function buildEmail(){
  const d = A.data, wk = isoWeek(d.week);
  const subject = `Lunchbeställning ${TEAM} v.${wk} – tis ${fmtShort(d.tue_date)} & tor ${fmtShort(d.thu_date)}`;
  const om = aOrders();
  const tagStr = x => { const t = (x.tags || []).filter(t => DIET.includes(t)); return t.length ? ` (${t.join(", ")})` : ""; };
  const block = (day, label, dateStr) => {
    const C = computeDay(day);
    let s = `${label.toUpperCase()} ${fmtDaySv(dateStr)} – ${C.total} portioner\n`;
    d[day].filter(x => x.active).forEach(x => {
      const n = (C.counts.get(x.id) || 0) + (C.extras.get(x.id) || 0);
      if (n) s += `  ${String(n).padStart(2," ")} × ${x.name}${tagStr(x)}${C.extras.get(x.id) ? ` (varav ${C.extras.get(x.id)} extra)` : ""}\n`;
    });
    if (C.notes.length) {
      s += `\n  Särskilda önskemål:\n`;
      C.notes.forEach(n => { s += `  – ${n.p.name}: ${dishName(day, n.dish)} – ${n.note}\n`; });
    }
    const named = d.people.map(p => ({ p, o:(om[p.id] || {})[day] })).filter(x => x.o && !x.o.skip);
    if (named.length) {
      s += `\n  Namnlista:\n`;
      named.forEach(({p,o}) => { s += `  ${p.name} – ${dishName(day, o.dish)}\n`; });
    }
    return s;
  };
  const body = `Hej!\n\nHär kommer ${TEAM}s lunchbeställning för vecka ${wk}.\n\n${block("tue","Tisdag",d.tue_date)}\n${block("thu","Torsdag",d.thu_date)}\nTack!\n\nMed vänliga hälsningar\n${TEAM}`;
  return { subject, body };
}

async function copy(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(okMsg); } catch (_) { toast("Couldn't copy. Select the text by hand.", true); }
    ta.remove();
  }
}

/* ---------- events ---------- */
function draftFor(scope){ return scope === "a" ? A.modal.draft : P.draft; }
function rerender(scope){ scope === "a" ? renderAdmin() : renderPlayer(); }
function keepNote(scope){
  ["tue","thu"].forEach(k => { const el = document.getElementById(`note-${scope}-${k}`); if (el) draftFor(scope)[k].note = el.value; });
}

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, scope = el.dataset.scope, day = el.dataset.day;
  if (act === "closemodal" && el.classList.contains("scrim") && ev.target !== el) return;

  if (act === "pick" || act === "skip") {
    if (scope === "p" && P.locked[day]) return;
    keepNote(scope);
    const dr = draftFor(scope)[day];
    if (act === "pick") { dr.dish = Number(el.dataset.id); dr.skip = false; }
    if (act === "skip") { dr.skip = !dr.skip; if (dr.skip) { dr.dish = null; dr.note = ""; } }
    if (scope === "p") P.confirm = false;
    const y = window.scrollY; rerender(scope);
    if (scope === "p") window.scrollTo({ top: y });
    return;
  }
  // player
  if (act === "person") return openPerson(Number(el.dataset.id));
  if (act === "back") { P.view = "names"; P.person = null; P.confirm = false; renderPlayer(); try { await playerLoad(); renderPlayer(); } catch(e){} window.scrollTo({top:0}); return; }
  if (act === "review") { keepNote("p"); P.confirm = true; renderPlayer(); return; }
  if (act === "unconfirm") { P.confirm = false; renderPlayer(); return; }
  if (act === "submit") { keepNote("p"); return submitPlayer(); }

  // admin
  if (act === "logout") { A.pw = null; A.data = null; store.sdel("aik_admin"); renderLogin(); return; }
  if (act === "tab") { A.tab = el.dataset.tab; renderAdmin(); return; }
  if (act === "wk") { const w = addDays(A.week, Number(el.dataset.d)); A.menuText = ""; await adminRefresh(w); return; }
  if (act === "reload") { await adminRefresh(); toast("Updated"); return; }
  if (act === "extra") {
    const id = Number(el.dataset.id);
    const cur = (A.data.extras || []).find(e => e.day === day && e.dish === id);
    const q = Math.max(0, (cur ? cur.qty : 0) + Number(el.dataset.d));
    A.data.extras = (A.data.extras || []).filter(e => !(e.day === day && e.dish === id));
    if (q > 0) A.data.extras.push({ day, dish:id, qty:q });
    renderAdmin();
    try { await rpc("admin_set_extra", { p_pw:A.pw, p_week:A.week, p_day:day, p_dish:id, p_qty:q }); }
    catch (e) { toast(e.message, true); adminRefresh(); }
    return;
  }
  if (act === "copyremind") return copy(reminderText(), "Reminder copied. Paste it in the team chat.");
  if (act === "editorder") {
    const id = Number(el.dataset.id), om = aOrders()[id] || {};
    A.modal = { id, draft:{ tue:fromServer(om.tue), thu:fromServer(om.thu) } }; renderAdmin(); return;
  }
  if (act === "closemodal") { A.modal = null; renderAdmin(); return; }
  if (act === "clearorder") { A.modal.draft = { tue:blankDay(), thu:blankDay() }; renderAdmin(); return; }
  if (act === "saveorder") {
    keepNote("a"); A.busy = true; renderAdmin();
    const m = A.modal;
    try {
      await rpc("admin_set_order", { p_pw:A.pw, p_week:A.week, p_person:m.id, p_day:"tue", p_order:toPayload(m.draft.tue) });
      await rpc("admin_set_order", { p_pw:A.pw, p_week:A.week, p_person:m.id, p_day:"thu", p_order:toPayload(m.draft.thu) });
      A.modal = null; toast("Order saved");
    } catch (e) { toast(e.message, true); }
    A.busy = false; await adminRefresh(); return;
  }
  if (act === "menuedit") { A.menuText = A.data.tue.filter(x => x.active).map(x => (x.tags.includes("V") ? "Vegetarisk: " : "") + x.name + x.tags.filter(t => DIET.includes(t)).map(t => " -" + t).join("")).join("\n"); renderAdmin(); return; }
  if (act === "menuclear") { A.menuText = ""; renderAdmin(); return; }
  if (act === "menusave") {
    const items = parseMenu(document.getElementById("menutext").value);
    if (await adminCall("admin_set_tuesday", { p_week:A.week, p_items:items }, "Tuesday menu published")) { A.menuText = ""; renderAdmin(); }
    return;
  }
  if (act === "thutag" || act === "thuactive") {
    const x = A.data.thu.find(d => d.id === Number(el.dataset.id)); if (!x) return;
    const name = document.getElementById(`thu-name-${x.id}`)?.value || x.name;
    const tags = act === "thutag" ? (x.tags.includes(el.dataset.tag) ? x.tags.filter(t => t !== el.dataset.tag) : [...x.tags, el.dataset.tag]) : x.tags;
    const active = act === "thuactive" ? !x.active : x.active;
    await adminCall("admin_dish", { p_id:x.id, p_name:name, p_tags:tags, p_active:active }, "Saved");
    return;
  }
  if (act === "thuadd") {
    const v = document.getElementById("thu-new").value.trim(); if (!v) return toast("Type the dish name first.", true);
    await adminCall("admin_dish", { p_id:null, p_name:v, p_tags:[], p_active:true }, "Dish added"); return;
  }
  if (act === "savemail") { A.mailTo = document.getElementById("mailto").value.trim(); await adminCall("admin_settings", { p_email:A.mailTo, p_new_pw:null }, "Address saved"); return; }
  if (act === "copymail") { const { subject, body } = buildEmail(); return copy(`Ämne: ${subject}\n\n${body}`, "Email text copied"); }
  if (act === "marksent") { await adminCall("admin_mark_sent", { p_week:A.week }, "Marked as sent"); return; }
  if (act === "openmail") { setTimeout(() => toast("Tap Mark as sent once the email has gone."), 600); return; }
  if (act === "psave" || act === "pactive") {
    const id = Number(el.dataset.id), p = A.data.all_people.find(x => x.id === id);
    const name = document.getElementById(`pn-${id}`).value, tag = document.getElementById(`pt-${id}`).value, kind = document.getElementById(`pk-${id}`).value;
    await adminCall("admin_person", { p_id:id, p_name:name, p_kind:kind, p_tag:tag, p_active: act === "pactive" ? !p.active : p.active }, "Saved");
    return;
  }
  if (act === "padd") {
    const name = document.getElementById("pn-new").value, tag = document.getElementById("pt-new").value, kind = document.getElementById("pk-new").value;
    if (!name.trim()) return toast("Type a name first.", true);
    await adminCall("admin_person", { p_id:null, p_name:name, p_kind:kind, p_tag:tag, p_active:true }, `${name.trim()} added`);
    return;
  }
  if (act === "copylink") return copy(document.getElementById("plink").value, "Link copied");
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "q") { P.q = t.value; const pos = t.selectionStart; renderPlayer(); const n = document.getElementById("q"); if (n) { n.focus(); try { n.setSelectionRange(pos,pos); } catch(e){} } return; }
  if (t.dataset && t.dataset.act === "note") { draftFor(t.dataset.scope)[t.dataset.day].note = t.value; return; }
  if (t.id === "menutext") { A.menuText = t.value; clearTimeout(t._d); t._d = setTimeout(() => { const pos = t.selectionStart; renderAdmin(); const n = document.getElementById("menutext"); if (n) { n.focus(); try { n.setSelectionRange(pos,pos); } catch(e){} } }, 450); return; }
  if (t.id === "mailto") { A.mailTo = t.value; return; }
});
document.addEventListener("change", async (ev) => {
  if (ev.target.id === "mailto") { A.mailTo = ev.target.value; renderAdmin(); return; }
  const tid = ev.target.dataset && ev.target.dataset.thu;
  if (tid) { const x = A.data.thu.find(d => d.id === Number(tid)); const v = ev.target.value.trim();
    if (x && v && v !== x.name) await adminCall("admin_dish", { p_id:x.id, p_name:v, p_tags:x.tags, p_active:x.active }, "Name saved"); }
});
document.addEventListener("submit", async (ev) => {
  if (ev.target.id === "loginf") {
    ev.preventDefault();
    const pw = document.getElementById("pw").value;
    try { await rpc("admin_login", { p_pw: pw }); A.pw = pw; store.sset("aik_admin", pw); await adminLoad(null); renderAdmin(); }
    catch (e) { toast(e.message, true); }
  }
  if (ev.target.id === "pwf") {
    ev.preventDefault();
    const a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
    if (a !== b) return toast("The passwords don't match.", true);
    if (await adminCall("admin_settings", { p_email:null, p_new_pw:a }, "Password changed")) { A.pw = a; store.sset("aik_admin", a); }
  }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && A.modal) { A.modal = null; renderAdmin(); } });

/* ---------- router ---------- */
let cdTimer, pollTimer;
async function route(){
  clearInterval(cdTimer); clearInterval(pollTimer);
  if (location.hash === "#admin") {
    A.pw = A.pw || store.sget("aik_admin");
    if (!A.pw) return renderLogin();
    $app.innerHTML = `<div class="loading"><div class="spin"></div><div>Loading…</div></div>`;
    await adminRefresh(null);
    pollTimer = setInterval(() => { if (document.visibilityState === "visible" && !A.modal && A.tab === "overview" && location.hash === "#admin") adminRefresh(); }, 45000);
    return;
  }
  try { await playerLoad(); P.view = "names"; renderPlayer(); }
  catch (e) { $app.innerHTML = `<div class="wrap">${topbar("Lunch orders")}<div class="closed-note">${esc(e.message)}</div><div class="toolbar"><button class="btn" onclick="location.reload()">Try again</button></div></div>`; return; }
  cdTimer = setInterval(() => {
    const el = document.querySelector("[data-cd]"); if (!el || !P.state) return;
    const ms = new Date(P.state.deadline).getTime() - nowServer();
    if (ms <= 0) { playerLoad().then(renderPlayer).catch(() => {}); } else el.textContent = countdown(ms);
  }, 30000);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
